<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="ayush - Full stack and AI engineer. I love to make and break stuff." />
        <script>
            try {
                if (localStorage.getItem("ayush-theme") === "light") {
                    document.documentElement.classList.add("light");
                }
            } catch {}
        </script>
        <link rel="stylesheet" href="/styles.css" />
        <title>ayush</title>
    </head>
    <body>
        <div class="page-shell">
            <main class="workspace">
                <section class="intro-pane" aria-labelledby="intro-title">
                    <div class="intro-content">
                        <div class="hero-heading">
                            <h1 id="intro-title">
                                <span id="intro-greeting"></span>
                                <em id="profile-name"></em><span
                                    class="wave"
                                    id="intro-wave"></span>
                            </h1>
                            <button
                                class="theme-switch"
                                id="theme-toggle"
                                type="button"
                                aria-label="Switch to light mode"
                                aria-pressed="false">
                                <svg
                                    class="theme-switch-sun"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    aria-hidden="true">
                                    <circle cx="12" cy="12" r="4" />
                                    <path
                                        d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
                                </svg>
                                <svg
                                    class="theme-switch-moon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true">
                                    <path
                                        d="M20.5 14.3A8.4 8.4 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z" />
                                </svg>
                                <span class="visually-hidden"
                                    id="theme-label">Switch to light mode</span>
                            </button>
                        </div>
                        <p class="headline-tail">
                            <span id="headline-prefix"></span>
                            <span class="flip-window"><span class="flip-word"
                                    id="flip-word"></span></span>
                        </p>

                        <div class="description" id="profile-description"></div>

                        <nav class="socials" id="social-links"
                            aria-label="Social links"></nav>

                        <section
                            class="activity"
                            aria-label="GitHub contribution activity">
                            <div class="chart-wrap">
                                <div
                                    class="months"
                                    id="chart-months"
                                    aria-hidden="true"></div>
                                <div
                                    class="chart-grid"
                                    id="chart-grid"
                                    aria-label="GitHub contribution heatmap"></div>
                            </div>
                            <div class="chart-footer">
                                <span id="chart-status"
                                    aria-live="polite">Loading GitHub
                                    activity…</span>
                                <div class="legend" aria-hidden="true">
                                    <span>less</span><i data-level="0"></i><i
                                        data-level="1"></i><i
                                        data-level="2"></i><i
                                        data-level="3"></i><i
                                        data-level="4"></i><span>more</span>
                                </div>
                            </div>
                        </section>

                        <section
                            class="experience"
                            aria-labelledby="experience-title">
                            <h2 id="experience-title">Experience</h2>
                            <div
                                class="experience-list"
                                id="experience-list"></div>
                        </section>
                    </div>
                </section>

                <section
                    class="terminal-pane"
                    aria-label="Interactive portfolio terminal">
                    <div class="terminal-frame">
                        <div
                            class="terminal-body"
                            id="terminal-body"
                            role="log"
                            aria-live="polite"
                            aria-relevant="additions text">
                            <div id="terminal-output"></div>
                        </div>
                        <div class="terminal-composer">
                            <div
                                class="command-menu"
                                id="command-menu"
                                hidden></div>
                            <form id="terminal-form" autocomplete="off">
                                <input
                                    id="terminal-input"
                                    type="text"
                                    placeholder
                                    aria-label="Terminal command"
                                    aria-controls="command-menu"
                                    aria-expanded="false"
                                    spellcheck="false" />
                                <button
                                    type="submit"
                                    class="send-button"
                                    aria-label="Send command">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        aria-hidden="true">
                                        <path
                                            d="m21 3-7.5 18-2.8-7.7L3 10.5 21 3Z" />
                                        <path d="m21 3-10.3 10.3" />
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <script type="module" src="/app.js"></script>
    </body>
</html>
